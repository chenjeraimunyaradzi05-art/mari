name: ATHENA CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --- BACKEND CI ---
  backend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: athena-platform/server/package-lock.json
    
    - name: Install dependencies
      working-directory: ./athena-platform/server
      run: npm ci

    - name: Build
      working-directory: ./athena-platform/server
      run: npm run build
      
    - name: Run Linter
      working-directory: ./athena-platform/server
      run: npm run lint --if-present
      
    - name: Run Tests
      working-directory: ./athena-platform/server
      env:
        NODE_ENV: test
      run: npm test --if-present

  # --- FRONTEND CI ---
  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: athena-platform/client/package-lock.json
    
    - name: Install dependencies
      working-directory: ./athena-platform/client
      run: npm ci
      
    - name: Run Linter
      working-directory: ./athena-platform/client
      run: npm run lint

    - name: Run Unit Tests
      working-directory: ./athena-platform/client
      run: npm run test:unit -- --passWithNoTests

    - name: Build
      working-directory: ./athena-platform/client
      env:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:5000
      run: npm run build

    - name: Install Playwright (Chromium)
      working-directory: ./athena-platform/client
      run: npx playwright install --with-deps chromium

    - name: Run E2E smoke tests
      working-directory: ./athena-platform/client
      env:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        PLAYWRIGHT_REUSE_SERVER: 'false'
      run: npx playwright test tests/smoke.spec.ts --project=chromium
