name: Database Migrate (Neon)

on:
  push:
    branches: [main]
    paths:
      - 'athena-platform/server/prisma/**'
      - 'athena-platform/server/src/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force migration even without schema changes'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20'

jobs:
  migrate:
    name: Run Prisma migrations → Neon
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: athena-platform/server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: athena-platform/server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Deploy migrations to Neon
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Database migration failed on main',
              body: `Migration workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'database'],
            })
