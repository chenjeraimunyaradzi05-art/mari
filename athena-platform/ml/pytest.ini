[pytest]
# Run from ml/: `python -m pytest`. The service imports itself as `src.api...`,
# so ml/ has to be on the path, and the tests import their helpers as
# `tests.support`, which is also what a pickled stand-in model is loaded back
# as. importlib mode keeps pytest from climbing to the ml/__init__.py above and
# importing everything under a second, `ml.`-prefixed name.
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib -p no:cacheprovider
