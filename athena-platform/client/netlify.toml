# ===========================================
# ATHENA CLIENT — NETLIFY CONFIGURATION
# ===========================================
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Kept identical to the root netlify.toml, which is the one Netlify actually
  # resolved on the last deploy. Two config files disagreeing about the build
  # is how the publish directory ended up unset in the first place.
  #
  # This previously ran `node ../../scripts/netlify-build.mjs`, which does not
  # exist in this repository — not here and not on main. Any deploy that
  # resolved this file rather than the root one would have failed outright.
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # -------------------------------------------------------
  # REQUIRED — set in Netlify Dashboard → Site Settings → Environment Variables:
  #   NEXT_PUBLIC_API_URL = "https://api.your-domain.com"
  #   NEXT_PUBLIC_APP_URL = "https://YOUR-APP.netlify.app"
  # Neon support:
  #   Netlify Database provisions NETLIFY_DB_URL automatically when @netlify/database is installed.
  #   Existing Neon deployments can provide NEON_DATABASE_URL / NEON_DIRECT_DATABASE_URL.
  #   The build wrapper maps these values to DATABASE_URL / DIRECT_DATABASE_URL before Next builds.
  # -------------------------------------------------------

# Enable Next.js runtime (handles SSR, ISR, API routes, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ===========================================
# RUNTIME ROUTING
# ===========================================
# No /api/* or /uploads/* rules here on purpose.
#
# There used to be `/uploads/* -> /uploads/:splat` with force = true. It
# pointed at itself rather than at the backend, so it served nothing — and
# because `force` wins over a function, it would now also shadow the
# app/uploads/[...path] route that actually proxies user media.
#
# A redirect in this file cannot read an environment variable, so sending
# these to the backend from here would mean hardcoding the Railway host.
# Both paths are proxied in-app instead, reading NEXT_PUBLIC_API_URL at
# request time:
#
#   /api/auth/*   app/api/auth/*        (forwards Set-Cookie itself)
#   /api/*        app/api/[...path]     (all verbs, generic pass-through)
#   /uploads/*    app/uploads/[...path] (user media)
#
# Realtime connects directly to the backend via NEXT_PUBLIC_SOCKET_URL,
# falling back to NEXT_PUBLIC_API_URL.

# ===========================================
# SECURITY HEADERS
# ===========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"

# ===========================================
# CACHING
# ===========================================

# Immutable Next.js static chunks (JS/CSS with content hash)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets in /public (images, fonts, icons)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
