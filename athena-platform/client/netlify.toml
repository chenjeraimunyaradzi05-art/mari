# ===========================================
# ATHENA CLIENT — NETLIFY CONFIGURATION
# ===========================================
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "node ../../scripts/netlify-build.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # -------------------------------------------------------
  # REQUIRED — set in Netlify Dashboard → Site Settings → Environment Variables:
  #   NEXT_PUBLIC_API_URL = "https://api.your-domain.com"
  #   NEXT_PUBLIC_APP_URL = "https://YOUR-APP.netlify.app"
  # Neon support:
  #   Netlify Database provisions NETLIFY_DB_URL automatically when @netlify/database is installed.
  #   Existing Neon deployments can provide NEON_DATABASE_URL / NEON_DIRECT_DATABASE_URL.
  #   The build wrapper maps these values to DATABASE_URL / DIRECT_DATABASE_URL before Next builds.
  # -------------------------------------------------------

# Enable Next.js runtime (handles SSR, ISR, API routes, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ===========================================
# RUNTIME ROUTING
# ===========================================
# Keep only the uploads self-rewrite here.
# Realtime should connect directly to the backend using:
#   NEXT_PUBLIC_SOCKET_URL
# falling back to:
#   NEXT_PUBLIC_API_URL
[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"
  status = 200
  force = true

# ===========================================
# SECURITY HEADERS
# ===========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"

# ===========================================
# CACHING
# ===========================================

# Immutable Next.js static chunks (JS/CSS with content hash)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets in /public (images, fonts, icons)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
