# ===========================================
# ATHENA CLIENT — NETLIFY CONFIGURATION
# ===========================================
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Kept identical to the root netlify.toml, which is the one Netlify actually
  # resolved on the last deploy. Two config files disagreeing about the build
  # is how the publish directory ended up unset in the first place.
  #
  # This previously ran `node ../../scripts/netlify-build.mjs`, which does not
  # exist in this repository — not here and not on main. Any deploy that
  # resolved this file rather than the root one would have failed outright.
  #
  # scripts/check-web-env.js fails the build when PROXY_SHARED_SECRET is
  # missing, rather than letting instrumentation.ts refuse every request after
  # the deploy has gone live. See the root netlify.toml.
  # No --legacy-peer-deps; see the root netlify.toml for why it was dropped.
  command = "npm ci && node scripts/check-web-env.js && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # -------------------------------------------------------
  # REQUIRED — set in Netlify Dashboard → Site Settings → Environment Variables:
  #   NEXT_PUBLIC_API_URL = "https://api.your-domain.com"
  #   NEXT_PUBLIC_APP_URL = "https://YOUR-APP.netlify.app"
  #   PROXY_SHARED_SECRET = the same value as on the API, 32+ characters.
  #     Server-only (no NEXT_PUBLIC_ prefix). The web host refuses to serve
  #     without it in production (instrumentation.ts): without it every member
  #     shares one login budget, the lockout keys on this host, and new-device
  #     alerts never fire.
  # SET TOGETHER WITH THE API'S TURNSTILE_SECRET_KEY:
  #   NEXT_PUBLIC_TURNSTILE_SITE_KEY = the site key of the same Turnstile
  #     widget. Shows the human check on the sign-up form. The secret on the API
  #     without this refuses every password sign-up; this without the secret
  #     shows a check nobody verifies.
  # No database variables here. The web tier never opens a database
  # connection: every /api request is proxied to the API host, which is the
  # only thing that holds the Neon DATABASE_URL / DIRECT_DATABASE_URL.
  # -------------------------------------------------------

# Enable Next.js runtime (handles SSR, ISR, API routes, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ===========================================
# RUNTIME ROUTING
# ===========================================
# No /api/* or /uploads/* rules here on purpose.
#
# There used to be `/uploads/* -> /uploads/:splat` with force = true. It
# pointed at itself rather than at the backend, so it served nothing — and
# because `force` wins over a function, it would now also shadow the
# app/uploads/[...path] route that actually proxies user media.
#
# A redirect in this file cannot read an environment variable, so sending
# these to the backend from here would mean hardcoding the API host.
# Both paths are proxied in-app instead, to the NEXT_PUBLIC_API_URL the site
# was *built* with:
#
#   /api/auth/*   app/api/auth/*        (forwards Set-Cookie itself)
#   /api/*        app/api/[...path]     (all verbs, generic pass-through)
#   /uploads/*    app/uploads/[...path] (user media)
#
# This note used to say the handlers read NEXT_PUBLIC_API_URL "at request
# time". They do not. Next.js replaces every NEXT_PUBLIC_* reference with its
# build-time value, in the server route handlers as well as in the browser
# bundle, so changing the variable in the Netlify dashboard does nothing until
# a new deploy builds the site again. Set it, then start a new build (Deploys,
# "Trigger deploy"). The root netlify.toml and
# athena-platform/docs/runbooks/ONCALL.md say the same.
#
# Realtime connects directly to the backend via NEXT_PUBLIC_SOCKET_URL,
# falling back to NEXT_PUBLIC_API_URL; both are baked in at build time too.

# ===========================================
# SECURITY HEADERS
# ===========================================
# X-Frame-Options here said DENY while next.config.js and public/_headers said
# SAMEORIGIN, and that disagreement was treated as the bug. It was not the one
# that mattered: this block also sends a Content-Security-Policy, and CSP Level
# 2 requires a browser to ignore X-Frame-Options on any response carrying a
# frame-ancestors directive. `frame-ancestors 'self'` is what all three layers
# sent, so DENY here was already dead text and every current browser allowed
# ATHENA to frame itself.
#
# All four layers — this file, public/_headers, src/proxy.ts and the headers()
# block in next.config.js — now say 'none'/DENY, so the browser enforces what
# the files claim. Nothing frames an ATHENA page; the iframes in the client
# embed third parties, which `frame-src` governs.
#
# frame-src and font-src are spelled out here to match src/proxy.ts. A browser
# that receives two policies enforces both, and this one used to leave
# frame-src to default-src 'self': wherever it was served beside the proxy's,
# the Stripe card form, Google sign-in, the classroom's YouTube and Vimeo
# players and the Turnstile check on the sign-up form were all blocked, and
# with TURNSTILE_SECRET_KEY set on the API a blocked Turnstile frame means
# every password sign-up is refused. The same gap in public/_headers is
# handed to its owner.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://challenges.cloudflare.com"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"

# ===========================================
# CACHING
# ===========================================

# Immutable Next.js static chunks (JS/CSS with content hash)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets in /public (images, fonts, icons)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
