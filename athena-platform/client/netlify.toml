# ===========================================
# ATHENA CLIENT — NETLIFY CONFIGURATION
# ===========================================
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm ci --legacy-peer-deps && npm run build"
  # publish directory is handled automatically by @netlify/plugin-nextjs

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # -------------------------------------------------------
  # REQUIRED — set in Netlify Dashboard → Site Settings → Environment Variables:
  #   NEXT_PUBLIC_API_URL = "https://YOUR-SERVER.up.railway.app"
  #   NEXT_PUBLIC_APP_URL = "https://YOUR-APP.netlify.app"
  # -------------------------------------------------------

# Enable Next.js runtime (handles SSR, ISR, API routes, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ===========================================
# RUNTIME ROUTING
# ===========================================
# Keep only the uploads self-rewrite here.
# Realtime should connect directly to Railway using:
#   NEXT_PUBLIC_SOCKET_URL
# falling back to:
#   NEXT_PUBLIC_API_URL
[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"
  status = 200
  force = true

# ===========================================
# SECURITY HEADERS
# ===========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"

# ===========================================
# CACHING
# ===========================================

# Immutable Next.js static chunks (JS/CSS with content hash)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets in /public (images, fonts, icons)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service worker must never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
