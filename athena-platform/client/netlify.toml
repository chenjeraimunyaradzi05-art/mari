[build]
  command = "npm install --legacy-peer-deps && npm run build"
  # publish directory is handled automatically by @netlify/plugin-nextjs

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # REQUIRED: Set NEXT_PUBLIC_API_URL in Netlify Dashboard → Site Settings → Environment Variables
  # Example: NEXT_PUBLIC_API_URL = "https://athena-api-production.up.railway.app"

# Enable Next.js runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy API calls to Railway backend
# Requires NEXT_PUBLIC_API_URL env var set in Netlify Dashboard
[[redirects]]
  from = "/api/*"
  to = "${NEXT_PUBLIC_API_URL}/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-From = "Netlify"

# Proxy uploads to backend
[[redirects]]
  from = "/uploads/*"
  to = "${NEXT_PUBLIC_API_URL}/uploads/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
