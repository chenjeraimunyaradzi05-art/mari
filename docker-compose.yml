version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-athena
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: athena_dev
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d athena_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
