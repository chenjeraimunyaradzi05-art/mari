openapi: 3.0.1
info:
  title: TurboTax Integration POC
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /projection:
    post:
      summary: Generate a tax projection from a TaxContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tax_context:
                  type: object
      responses:
        '200':
          description: Projection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  projection:
                    type: object
