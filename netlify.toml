[build]
  base = "athena-platform/client"
  command = "npm ci --legacy-peer-deps && npm run build"
  # publish = ".next" # Let Next.js plugin handle the publish directory

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Set NEXT_PUBLIC_API_URL in Netlify Dashboard Environment Variables
  # Example: NEXT_PUBLIC_API_URL = "https://api.your-domain.com"

# Enable Next.js runtime - REQUIRED for Next.js 14 on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect API calls to backend (configure API URL in Netlify env vars)
