[build]
command = "npm run build"
functions = "netlify/functions"
publish = ".next"

[functions]
	node_bundler = "esbuild"
	external_node_modules = []

[dev]
command = "npm run dev"
port = 3000

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[scheduled.functions]]
	name = "propensity-refresh"
	path = "/api/cron/propensity"
	schedule = "0 5 * * *" # daily at 05:00 UTC
	method = "POST"
	body = "limit=500"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[env.production]
[env.production.build]
command = "npm run build"

[[env.production.context.functions."*".environment]]
DATABASE_URL = "postgresql://..."
NODE_ENV = "production"
