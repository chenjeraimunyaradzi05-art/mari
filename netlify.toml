[build]
  base = "athena-platform/client"
  command = "node ../../scripts/netlify-build.mjs"
  # publish = ".next" # Let Next.js plugin handle the publish directory

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Set NEXT_PUBLIC_API_URL in Netlify Dashboard Environment Variables
  # Example: NEXT_PUBLIC_API_URL = "https://api.your-domain.com"
  # Neon support:
  # - Netlify Database provisions NETLIFY_DB_URL automatically when @netlify/database is installed.
  # - Existing Neon deployments can provide NEON_DATABASE_URL / NEON_DIRECT_DATABASE_URL.
  # The build wrapper maps these values to DATABASE_URL / DIRECT_DATABASE_URL before Next builds.

# Enable Next.js runtime - REQUIRED for Next.js on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep uploads route available for deployments that proxy media through the app.
[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
