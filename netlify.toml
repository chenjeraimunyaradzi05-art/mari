[build]
  base = "athena-platform/client"
  command = "npm ci --legacy-peer-deps && npm run build"
  # publish = ".next" # Let Next.js plugin handle the publish directory

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Set NEXT_PUBLIC_API_URL in Netlify Dashboard Environment Variables
  # Example: NEXT_PUBLIC_API_URL = "https://server-production-1849.up.railway.app"

# Enable Next.js runtime - REQUIRED for Next.js 14 on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# No /api/* or /uploads/* redirect rules here on purpose.
#
# Redirects in this file cannot read environment variables, so proxying to the
# backend from here would mean hardcoding the Railway host. Both paths are
# proxied in-app instead, reading NEXT_PUBLIC_API_URL at request time:
#
#   /api/auth/*   app/api/auth/*        (forwards Set-Cookie itself)
#   /api/*        app/api/[...path]     (all verbs, generic pass-through)
#   /uploads/*    app/uploads/[...path] (user media)
#
# See athena-platform/client/public/_redirects for the same note.
