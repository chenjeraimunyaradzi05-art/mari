name: Security Audit

# Weekly advisory sweep of every package's lockfile. Deliberately separate from
# CI: a new advisory published against a dependency nobody touched should not
# turn an unrelated pull request red, but it should still be noticed.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Audit ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Each package reports independently; one failing advisory should not hide
      # the state of the other two.
      fail-fast: false
      matrix:
        package: [server, client, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm audit` reads the lockfile directly, so there is nothing to install.
      - name: Audit dependencies
        working-directory: athena-platform/${{ matrix.package }}
        run: npm audit --audit-level=high
