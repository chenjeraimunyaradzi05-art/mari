name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'athena-platform/mobile/**'
      - 'athena-platform/shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'athena-platform/mobile/**'
      - 'athena-platform/shared/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-platform/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: athena-platform/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The same static walk the server and web run: every api.<verb>('/path')
      # under mobile/src must match a route the server mounts. It needs no
      # server dependencies, only its source tree, which the checkout has.
      - name: API contract check (mobile against server routes)
        run: node ../server/scripts/check-api-contract.js

  # EAS builds cost real build minutes, so a pull request stops at the type
  # check. Merges and manual runs are what actually produce a binary.
  preflight:
    name: Resolve Expo credentials
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      expo: ${{ steps.probe.outputs.expo }}
    steps:
      - name: Probe Expo credentials
        id: probe
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "expo=true" >> "$GITHUB_OUTPUT"
          else
            echo "expo=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not configured; skipping the EAS build."
          fi

  build:
    name: EAS build
    runs-on: ubuntu-latest
    needs: [check, preflight]
    if: needs.preflight.outputs.expo == 'true'
    defaults:
      run:
        working-directory: athena-platform/mobile
    env:
      # A push to main has no inputs, so it takes the same defaults the manual
      # form offers.
      EAS_PLATFORM: ${{ inputs.platform || 'all' }}
      EAS_PROFILE: ${{ inputs.profile || 'preview' }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: athena-platform/mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The API origin is not in eas.json any more. The values that were there
      # named api.athena.app, a domain ATHENA does not own, so every preview and
      # production binary was built pointing at a stranger. It now comes from
      # the EAS project's own environment — `eas secret:create --scope project
      # --name API_URL --value https://...` — which is where a value that
      # differs per deployment belongs. A build with it unset fails in
      # app.config.js rather than picking a host for you.
      - name: Build
        run: eas build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive

  submit:
    name: Submit to stores
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: inputs.profile == 'production'
    defaults:
      run:
        working-directory: athena-platform/mobile
    env:
      EAS_PLATFORM: ${{ inputs.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit
        run: eas submit --platform "$EAS_PLATFORM" --latest --non-interactive
