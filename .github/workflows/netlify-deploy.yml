name: Netlify Preview

# Preview deploys for pull requests only. The production deploy lives in
# "Build and Deploy", so that main is never published twice for one commit.

on:
  pull_request:
    branches: [main]
    paths:
      - 'athena-platform/client/**'
      - 'athena-platform/shared/**'
      - 'netlify.toml'
  workflow_dispatch:

concurrency:
  group: netlify-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request from a fork gets no secrets, so the credentials arrive empty
  # and a deploy would fail on nothing the author did. `secrets` cannot be read
  # from an `if`, so it is resolved to a boolean here and the deploy is gated on
  # that instead.
  preflight:
    name: Resolve Netlify credentials
    runs-on: ubuntu-latest
    outputs:
      netlify: ${{ steps.probe.outputs.netlify }}
    steps:
      - name: Probe Netlify credentials
        id: probe
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "netlify=true" >> "$GITHUB_OUTPUT"
          else
            echo "netlify=false" >> "$GITHUB_OUTPUT"
            echo "Netlify credentials are not configured; skipping the preview deploy."
          fi

  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.netlify == 'true'
    environment:
      name: preview

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `--build` runs the build described by netlify.toml, including the
      # Next.js runtime plugin. Uploading a prebuilt .next directory skips the
      # plugin and publishes a preview with no server routes, which is worse
      # than no preview at all.
      - name: Build and deploy preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_TELEMETRY_DISABLED: '1'
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes netlify-cli deploy --build --message "PR #${PR_NUMBER:-manual}"
