name: Railway Redeploy

# Manual redeploy of a single Railway service, for when a service needs pushing
# without a commit behind it. The automatic main-branch deploy lives in "Build
# and Deploy"; this workflow deliberately has no push trigger, so a merge cannot
# start two deploys of the same service against each other.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to redeploy'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - web
          - all

concurrency:
  group: railway-redeploy
  cancel-in-progress: false

jobs:
  api:
    name: Redeploy API
    runs-on: ubuntu-latest
    if: inputs.service == 'api' || inputs.service == 'all'
    environment:
      name: production
    defaults:
      run:
        working-directory: athena-platform/server

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # The service name is a secret so that a rename does not mean editing
      # every workflow; it falls back to the name the Railway project was
      # created with.
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
        run: railway up --service "${RAILWAY_SERVICE:-athena-api}" --detach

  web:
    name: Redeploy web
    runs-on: ubuntu-latest
    if: inputs.service == 'web' || inputs.service == 'all'
    environment:
      name: production
    defaults:
      run:
        working-directory: athena-platform/client

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
        run: railway up --service "${RAILWAY_SERVICE:-athena-web}" --detach
