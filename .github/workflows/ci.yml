name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: athena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Migrations
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/athena_test
      run: npx prisma migrate deploy

    - name: Run Seed (Smoke Test)
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/athena_test
      run: npx prisma db seed

    - name: Build
      run: npm run build
