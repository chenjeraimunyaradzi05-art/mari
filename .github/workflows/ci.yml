name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd athena-platform/server
          npm ci

      - name: Generate Prisma client
        run: |
          cd athena-platform/server
          npx prisma generate

      - name: Apply schema to test DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          cd athena-platform/server
          npx prisma db push --accept-data-loss

      # Static check, so it needs no database and no client install. Catches a
      # client call whose server route was never built, sits behind a `/:id`
      # route, or answers a different verb.
      - name: Check client/server API contract
        run: |
          cd athena-platform/server
          npm run check:api-contract

      # Also dependency-free, so it runs with plain node rather than installing
      # the client. Fails on a control a user can reach that does nothing.
      - name: Check for dead interactions in reachable UI
        run: node athena-platform/client/scripts/check-dead-interactions.js

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NODE_ENV: test
        run: |
          cd athena-platform/server
          npm test --silent
