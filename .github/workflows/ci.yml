name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-platform/server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # schema.prisma's datasource names `directUrl = env("DIRECT_DATABASE_URL")`
      # (the Neon direct host migrations need), and Prisma refuses the whole
      # schema when a variable it names is unset: "Environment variable not
      # found: DIRECT_DATABASE_URL" (P1012), checked 27 September 2026 with the
      # Prisma CLI this package pins. So `migrate deploy` below could not have
      # passed since the datasource gained it on 19 August, and no run showed
      # it: every CI run since then has ended within seconds, before a job
      # started, because of the account's billing lock. The service container
      # has no pooler, so both names point at the same database.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: athena-platform/server/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # `migrate deploy`, not `db push`. `db push` builds the test database
      # from schema.prisma and never opens prisma/migrations, so a migration
      # with broken SQL in it passed CI and only failed later against the real
      # database — which is the one place a failed migration costs something.
      # Running the migrations here means the same SQL production will run has
      # already run once, on an empty database, before anything is merged.
      - name: Apply migrations to test DB
        run: npx prisma migrate deploy

      # `db push` also hid the opposite mistake: a schema.prisma edit shipped
      # without the migration that makes it real. The tests would pass against
      # the pushed schema and production would be missing the column. This
      # compares the database the migrations just built against schema.prisma
      # and exits 2 when they disagree, which fails the step.
      - name: Check migrations match schema.prisma
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      # `build` is `tsc`, so this typechecks the whole server as well as
      # producing dist/. Running it before the tests means a type error is
      # reported once, here, instead of once per ts-jest suite.
      - name: Build
        run: npm run build

      # The Jest project transpiles without type-checking (jest.config.cjs
      # says why: the type-checking preset is what made each worker several
      # gigabytes). `npm run build` above covers src/ and its __tests__
      # suites; this covers the suites under tests/, which build never sees.
      - name: Type check the tests/ suites
        run: npx tsc -p tests/tsconfig.json

      # Static check, so it needs no database and no client install. Catches a
      # client call whose server route was never built, sits behind a `/:id`
      # route, or answers a different verb.
      - name: Check client/server API contract
        run: npm run check:api-contract

      # Fails when a document cites a path the repository does not contain.
      # Reads the git index rather than the filesystem, so it needs nothing
      # installed.
      - name: Check documentation references
        run: node scripts/check-doc-references.js

      # Also dependency-free, so it runs with plain node rather than installing
      # the client. Fails on a control a user can reach that does nothing.
      - name: Check for dead interactions in reachable UI
        run: node ../client/scripts/check-dead-interactions.js

      # `req.user!`, `any` as a type, and route files that validate nothing
      # with zod or express-validator: about eleven hundred, four hundred and
      # two hundred and thirty of them, and nothing stopped the next one. This
      # fails when any file has more than debt-ratchet-baseline.json records,
      # so the numbers only go down. It reads the TypeScript syntax tree, which
      # `npm ci` above has installed.
      - name: Check type-safety and validation debt has not grown
        run: node scripts/check-debt-ratchet.js

      # scripts/check-env.js existed, worked, and was called by nothing — so the
      # production drift it was written to catch (STRIPE_PRICE_STARTER for
      # STRIPE_PRICE_CAREER, OPENSEARCH_URL for OPENSEARCH_NODE, SES settings
      # for SendGrid) was the drift actually live on the host. Features ran in
      # their "not configured" branch and nothing failed at boot.
      #
      # It runs against render.yaml rather than against an env file because a
      # blueprint declares every name production will be given while holding
      # none of the values, and names are the half that drifts. Pointing it at
      # .env.production.template instead would fail forever for the one reason
      # nobody can fix: a template in a public repository cannot contain a real
      # Stripe key. Nothing here reads a secret.
      #
      # It fails on a variable that src/ requires in production and the
      # blueprint does not declare, and on a variable the blueprint declares
      # that nothing under src/ reads any more — the renamed-key case, where the
      # old name lingers and the new one was never added.
      - name: Check production env blueprint matches the code
        run: node scripts/check-env.js ../../render.yaml

      - name: Run tests
        run: npm test --silent

      # The mocked suite cannot exercise a migration, a constraint, a cascade or a
      # concurrent transaction, and the guards that most need exercising are the
      # conditional-updateMany claims on creator payouts and gift balances whose
      # whole correctness argument is that the database makes them atomic. This
      # job already has a Postgres service and has already run migrate deploy
      # against it, so the integration project runs here for free. It skips
      # loudly rather than silently when TEST_DATABASE_URL is unset.
      - name: Run integration tests (real database)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx jest --config jest.integration.config.cjs --silent

      # Last, and deliberately independent of everything above it: a console.log
      # left behind should not stop the typecheck and the tests from reporting,
      # and a failing test should not hide the lint result either, so this runs
      # on its own outcome. It only needs node_modules, hence the install
      # condition — without it a failed `npm ci` would fail twice and the second
      # failure ("eslint: not found") would explain nothing.
      # `--quiet` drops warnings so that only errors reach this log. Nothing
      # that could fail the step is hidden by it: eslint exits non-zero on an
      # error, and without --max-warnings no number of warnings fails it.
      # Measured on server/src, 19 September 2026: `npx eslint src` reports 78
      # problems — 0 errors, 78 warnings, every one of them
      # @typescript-eslint/no-unused-vars — and `npx eslint src --quiet`
      # prints nothing and exits 0. An earlier version of this comment blamed
      # @typescript-eslint/no-explicit-any for "about a thousand" warnings;
      # .eslintrc.cjs has since set that rule back to 'off' and it now emits
      # none. The unused-vars list is read by running `npm run lint` locally,
      # where it is the entire output. Making CI enforce that count would mean
      # adding --max-warnings, not removing this flag.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --quiet

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-platform/client
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      # `next start`, which Playwright runs below, is a production server, and
      # instrumentation.ts refuses to serve in production without
      # PROXY_SHARED_SECRET. There is no API in this job for it to match, so any
      # value of the right length will do; it is made fresh for each run rather
      # than written here, so nothing in the repository looks like a secret.
      - name: Generate a proxy secret for the web server
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "PROXY_SHARED_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: athena-platform/client/package-lock.json

      - name: Install dependencies
        # No --legacy-peer-deps: next@16 accepts react ^18.2.0, so there is no
        # peer conflict to suppress, and suppressing it here meant CI could not
        # report a real one introduced later.
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Every locale in i18n.registry.js must have a public/locales/<locale>/
      # common.json with the same keys as the base locale.
      - name: Check locale files
        run: npm run lint:i18n

      - name: Run unit tests
        run: npm run test:unit -- --passWithNoTests

      - name: Build
        run: npm run build

      # Playwright's webServer starts `next start` against the build above, so
      # the browser has to be installed after it and the build must not be
      # skipped.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # A pull request runs the specs that answer the API at the browser: the
      # smoke spec, the failure states and the search page. They take seconds
      # and give the same answer with or without an API. The rest of
      # critical-paths.spec.ts (the timing and keyboard checks, and the member
      # journey) runs on the merge instead, where nobody is waiting on it.
      #
      # There is no API in this job. The journey in tests/critical-paths.spec.ts
      # needs one, with fixtures, and is skipped here with that reason printed;
      # it runs for real in .github/workflows/e2e.yml, which starts Postgres and
      # the API first.
      - name: Run the web-tier E2E specs
        if: github.event_name == 'pull_request'
        run: npx playwright test tests/smoke.spec.ts tests/failure-states.spec.ts tests/search.spec.ts --project=chromium

      - name: Run full E2E suite
        if: github.event_name != 'pull_request'
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: athena-platform/client/playwright-report
          retention-days: 7

  # The recommendation service (athena-platform/ml) had pytest in its
  # requirements, no test files, and no workflow that would have run any. Its
  # suite covers the served API — feed ranking, mentor matching, income
  # streams, the safety score and the key check in front of all of them — and
  # runs here on the same Python as the image (python:3.11-slim in
  # ml/Dockerfile). requirements-test.txt is what src/api imports plus pytest,
  # not the training stack, so this installs in seconds rather than pulling
  # torch.
  ml:
    name: ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-platform/ml

    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: athena-platform/ml/requirements-test.txt

      - name: Install the served API's dependencies and the test tools
        run: python -m pip install -r requirements-test.txt

      - name: Run the tests
        run: python -m pytest

  # The alert rules in athena-platform/infrastructure/monitoring are not
  # evaluated by anything until a hosted metrics service exists (its README says
  # what the owner has to set up). Checking and unit-testing them here keeps
  # them from rotting before then: a rule that no longer parses, or over a
  # metric that no longer exists, would otherwise be found on the day it was
  # needed. The image is pinned so a promtool release cannot change the result.
  alert-rules:
    name: Alert rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-platform/infrastructure/monitoring

    steps:
      - uses: actions/checkout@v4

      - name: Check the rules
        run: docker run --rm -v "$PWD:/rules" -w /rules --entrypoint /bin/promtool prom/prometheus:v2.54.1 check rules alerts.yml

      - name: Test the rules
        run: docker run --rm -v "$PWD:/rules" -w /rules --entrypoint /bin/promtool prom/prometheus:v2.54.1 test rules alerts.test.yml
