# Render blueprint for the ATHENA API.
#
# The API had no home. The web app is on Netlify and the database is on Neon,
# but the Express server was never deployed anywhere, so the live site's
# /api/health answered 500 with a connection refused to localhost:5000 — every
# signed-in surface on athena-empress.netlify.app was talking to nothing.
#
# This file makes the API deployable without a console session: point Render at
# this repository ("New", "Blueprint"), and it creates the service, the Key
# Value instance the BullMQ workers need, and the environment, asking only for
# the values it cannot know. The alternative host is Fly.io; its equivalent is
# athena-platform/server/fly.toml. Pick one. DEPLOYMENT_GUIDE.md has the steps
# and the values.
#
# The image is athena-platform/server/Dockerfile, unchanged — the same one that
# runs locally through docker-compose.yml. Its CMD is `node dist/start.js`,
# which applies the Prisma migrations and then boots the server.

services:
  - type: web
    name: athena-api
    runtime: docker
    # Singapore is the closest Render region to Queensland. Neon's
    # ap-southeast-2 is Sydney, so the database round trip crosses an ocean
    # either way; keeping the API in the same hemisphere is the part that is in
    # our gift.
    region: singapore
    # 2GB. The process holds Prisma, sharp, ffmpeg and the BullMQ workers in
    # one container; the 512MB starter plan cannot load it.
    #
    # One instance, and it has to stay one instance. There is no numInstances
    # key below on purpose, and adding one is not a scaling decision — it is a
    # correctness decision that this codebase has not earned yet. Socket.IO
    # keeps its room membership in the process that owns the connection, and
    # there is no @socket.io/redis-adapter installed, so with two instances a
    # message emitted on A never reaches a socket connected to B. Chat,
    # presence, typing indicators and live notifications would half-work, for
    # half the members, with nothing logged anywhere: the emit succeeds, it just
    # reaches an empty room. src/index.ts already reasons this way out loud for
    # the rate limiters and the scheduled-sweep locks when REDIS_URL is missing;
    # the socket layer has no equivalent guard because it cannot have one.
    #
    # If one instance is not enough, take a larger plan. Scaling out needs the
    # adapter first.
    plan: standard
    branch: main
    dockerfilePath: athena-platform/server/Dockerfile
    dockerContext: athena-platform/server
    # /livez answers as soon as the process is listening. /readyz is the one
    # that checks the database, and it returns 503 during a graceful shutdown
    # drain, which a platform health check would read as a dead instance and
    # restart mid-drain. Monitor /readyz from outside; let Render watch /livez.
    healthCheckPath: /livez
    # A client-only commit should not restart the API.
    buildFilter:
      paths:
        - athena-platform/server/**
        - athena-platform/shared/**
        - render.yaml
    # Deliberately off. Render's own auto-deploy fires on the push, at the same
    # moment CI starts testing the commit — the same race that used to let a
    # failing commit migrate production. The "Deploy API to Render" job in
    # .github/workflows/build-and-deploy.yml calls this service's deploy hook
    # after CI is green and the migration has succeeded. Set the hook URL as
    # the RENDER_DEPLOY_HOOK_URL repository secret; without it nothing deploys
    # automatically and the Render dashboard button still works.
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is injected by Render and read by src/index.ts. It is not set here
      # on purpose: a literal would override the one Render assigns and the
      # health check would never connect.

      # Where the browser is. CLIENT_URL builds the links in outbound email,
      # ALLOWED_ORIGINS is the CORS allowlist, and FRONTEND_URL is the older
      # name some services still read. Change all three together when the site
      # moves to its own domain.
      - key: CLIENT_URL
        value: https://athena-empress.netlify.app
      - key: FRONTEND_URL
        value: https://athena-empress.netlify.app
      - key: ALLOWED_ORIGINS
        value: https://athena-empress.netlify.app
      # Leave this "false". Turned on, it does not admit this site's deploy
      # previews: it admits every https://<anything>.netlify.app origin, and
      # a netlify.app subdomain is free to anyone who signs up. The API
      # answers those origins with credentialed CORS and the socket accepts
      # them. Wherever the browser holds a cookie for this API's own origin —
      # COOKIE_SAMESITE=none, the setup where the browser calls the API
      # directly rather than through the web app's proxy — a page on a
      # stranger's Netlify site can then call the API as the signed-in member
      # and read what comes back. Preview builds belong against a staging
      # API, not this one.
      - key: CORS_ALLOW_PREVIEW_ORIGINS
        value: "false"

      # This service's own public address, e.g. https://athena-api.onrender.com
      # or the custom domain in front of it. Render cannot supply it here:
      # `fromService` gives the private hostname, not the public one. The
      # process refuses to start without it (src/utils/env.ts), because links
      # and any locally served file URL are built from it and saved.
      - key: API_URL
        sync: false

      # The secret the web tier sends with each visitor's address. Set the same
      # value on Netlify (Builds and Functions scopes); `openssl rand -hex 32`.
      # Not generated here, because Netlify has to be given the identical
      # value. Without it the API refuses to start, and without the match every
      # member shares one login budget and one lockout.
      - key: PROXY_SHARED_SECRET
        sync: false

      # The human check on password sign-up (Cloudflare Turnstile). Optional,
      # and set together with NEXT_PUBLIC_TURNSTILE_SITE_KEY on Netlify or not
      # at all: this half alone refuses every password sign-up.
      # /health/launch-readiness reports whether it is set.
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # Neon. DATABASE_URL is the pooled endpoint for runtime queries;
      # DIRECT_DATABASE_URL is the unpooled one, and start.ts runs the
      # migrations through it because PgBouncer in transaction mode cannot hold
      # the advisory locks Prisma migrations take. Putting the pooled URL in
      # both is the mistake that makes a deploy hang.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

      # Sessions, rate-limit counters and the BullMQ queues.
      - key: REDIS_URL
        fromService:
          type: redis
          name: athena-redis
          property: connectionString

      # Generated once by Render and then left alone. Rotating JWT_SECRET signs
      # every live member out, so it is not something to regenerate casually.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # The key that seals domestic-violence safe-chat messages, the wellness
      # records, safety plans and two-factor seeds. The API refuses to start
      # without 64 random hex characters (`openssl rand -hex 32`; all zeros and
      # placeholders are refused). It is entered by hand rather than
      # generated because it has to be backed up somewhere a lost Render
      # service cannot take with it: without this exact value the encrypted
      # rows are unreadable, and those are the rows that matter most.
      # Changing it is a rotation, not an edit: docs/runbooks/ENCRYPTION.md.
      - key: DV_ENCRYPTION_KEY
        sync: false

      # The key the list of banned people is hashed with. Unset, it is derived
      # from JWT_SECRET, and rotating JWT_SECRET would then unban everyone with
      # nothing to say so. `openssl rand -hex 32`, set once and kept with the
      # same backup as DV_ENCRYPTION_KEY: a different value later stops every
      # existing ban matching. docs/runbooks/ONCALL.md says how to set it on a
      # platform that already has bans.
      - key: BANNED_IDENTITY_HASH_KEY
        sync: false

      # Bearer tokens for /metrics and the health diagnostics detail. Nothing
      # outside the platform needs to know them, so Render can invent them.
      - key: METRICS_TOKEN
        generateValue: true
      - key: HEALTH_DIAGNOSTICS_TOKEN
        generateValue: true

      # Email. Without a real key the platform cannot send a verification or a
      # password reset, so registration completes and then strands the member.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      # The key SendGrid shows when its Signed Event Webhook is switched on, so
      # that bounced and spam-reported addresses stop being mailed.
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: TRUST_SAFETY_EMAIL
        sync: false
      # Who holds the duty to refer child-safety and terrorism reports to the
      # authorities (the AFP and eSafety). Nothing is transmitted automatically:
      # the report lands in the Authority referrals queue and this mailbox is
      # told. Falls back to TRUST_SAFETY_EMAIL when it is not set.
      - key: AUTHORITY_ESCALATION_EMAIL
        sync: false

      # Payments. The four price ids are the subscription tiers; the server
      # refuses to start a checkout for a tier whose price it cannot resolve.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # The Connect endpoint's own signing secret. Payout and connected-account
      # events (payout.paid, payout.failed, account.updated) arrive on a second
      # Stripe endpoint, "Listen to events on Connected accounts", and are
      # refused without it: a seller whose payout bounced, or whose account
      # Stripe stopped paying, is told nothing.
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CAREER
        sync: false
      - key: STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_ENTREPRENEUR
        sync: false
      - key: STRIPE_PRICE_CREATOR
        sync: false
      - key: ALLOW_STRIPE_SIMULATION
        value: "false"

      # Who ATHENA is on an invoice. The first four have no default and no invoice
      # document is produced until all four are set: a member's download answers
      # 503, and /health/launch-readiness fails in production, until they are. The
      # invoices themselves are filed as sales happen and keep, so nothing is lost
      # by setting them late. The ABN must pass its checksum; the billing mailbox
      # must be on a domain ATHENA owns; the address lines are separated by |.
      # ATHENA_GST_REGISTERED_FROM (YYYY-MM-DD) is optional: set it only once ATHENA
      # is registered for GST. "Tax invoice" and "includes GST" are said only when
      # it is set and the date has arrived; until then a document is an "Invoice"
      # that says no GST was charged, and the price pages say the same.
      - key: ATHENA_LEGAL_NAME
        sync: false
      - key: ATHENA_ABN
        sync: false
      - key: ATHENA_GST_REGISTERED_FROM
        sync: false
      - key: ATHENA_BILLING_ADDRESS
        sync: false
      - key: ATHENA_BILLING_EMAIL
        sync: false

      # Media. Uploads and processed video go to S3. There is no disk mounted
      # below on purpose: the container's own directory is replaced on every
      # deploy, so local media storage is not a configuration this platform
      # runs in. The process refuses to start without these three, or with
      # values that are not the shape AWS issues (src/utils/env.ts), and at
      # start it asks S3 whether the bucket answers; /health/launch-readiness
      # fails while it does not. The key needs s3:PutObject, GetObject and
      # DeleteObject on the bucket's objects, s3:ListBucket on the bucket, and
      # rekognition:DetectModerationLabels, which screens uploaded images.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      - key: S3_BUCKET
        sync: false
      # The CDN in front of the bucket's public folders, as its https address
      # (the CloudFront distribution's domain, or cdn.<your-domain> pointed at
      # it). Required: an avatar or a post picture is stored as `${CDN_URL}/key`,
      # the bucket keeps Block Public Access on so its own address answers 403,
      # and the process refuses to start without it rather than let the bucket
      # be opened to the internet to make pictures load, which would open every
      # résumé and chat file with them. Setup and the bucket policy are in
      # athena-platform/infrastructure/README.md ("Media bucket").
      - key: CDN_URL
        sync: false

      # Malware scanning. Every upload is looked inside by ClamAV before it is
      # kept, and a résumé or a document that cannot be scanned is refused
      # (src/services/malware-scan.service.ts), so until this is set a member
      # cannot attach a résumé to an application and /health/launch-readiness
      # fails. ClamAV is a service of its own, not part of this container: its
      # signature database needs about 1.5 GB of memory beside the API's.
      #
      # To run it on Render, create a Private Service (not in this blueprint,
      # because it is a second paid instance and creating one is the owner's call):
      #   Runtime: Docker image, docker.io/clamav/clamav:stable
      #   Region:  singapore (the same as this service, so it is on the same
      #            private network)
      #   Plan:    Standard (2 GB). Its first start downloads the signature
      #            database and takes a few minutes before it answers.
      #   Port:    3310
      # then set CLAMAV_HOST to its private hostname (the "Internal address"
      # on its page, without the port). The scanner takes files up to 25 MB as
      # shipped, which covers every résumé and document. To scan larger files
      # (reels), raise clamd's StreamMaxLength on the scanner (the image's own
      # documentation says how to override clamd.conf options) and set
      # MALWARE_SCAN_MAX_BYTES here to the same figure.
      #
      # MALWARE_SCAN_REQUIRED is left unset: in production that means "documents"
      # (résumés and documents are refused when unscanned; pictures, whose
      # bytes are rewritten on the way in, are stored). Set it to "all" to refuse
      # every unscanned upload, or "off" to decide not to scan at all.
      - key: CLAMAV_HOST
        sync: false

      # Where the off-platform database copies are held, as AWS region codes
      # (comma-separated). The API takes no part in backups — they are
      # .github/workflows/backup.yml — and reads this only to publish it:
      # GET /api/compliance/data-transfers lists these regions as backup
      # locations. Leave it empty until the backup bucket exists, and the
      # disclosure names no backup location, which is then the truth.
      - key: BACKUP_AWS_REGIONS
        sync: false

      # Text moderation and the AI features read AI_OPENAI_API_KEY first.
      - key: AI_OPENAI_API_KEY
        sync: false
      - key: AI_ALLOW_SIMULATION
        value: "false"

      # The Python recommendation service in athena-platform/ml. Optional. If it
      # is deployed, ML_SERVICE_KEY is the shared key the API sends as X-ML-Key,
      # set to the same value on the ML service, which in production refuses to
      # start without one.
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_KEY
        sync: false

      # Background jobs. With ENABLE_WORKERS=true and both flags below false,
      # the video worker hands every reel to an external transcoder at
      # VIDEO_PROCESSOR_URL and throws if there is not one — it does not fall
      # back. Set VIDEO_PROCESSOR_URL, or set VIDEO_PROCESSING_ALLOW_SIMULATION
      # to "true" and the reel is transcoded in this process by
      # video-pipeline.service.ts, using the ffmpeg binary that ships in the
      # image with the ffmpeg-static package. "Simulation" is the flag's name,
      # not what it does: that path is the real ffmpeg pipeline, and it is the
      # one a single-service deployment wants.
      #
      # The name here used to be VIDEO_ALLOW_SIMULATION, which nothing in src/
      # reads. It looked like it was turning the external processor off and it
      # was doing nothing at all. scripts/check-env.js enforces the pairing.
      - key: ENABLE_WORKERS
        value: "true"
      - key: WORKER_ALLOW_SIMULATION
        value: "false"
      - key: VIDEO_PROCESSING_ALLOW_SIMULATION
        value: "true"
      - key: VIDEO_PROCESSOR_URL
        sync: false

      # Scheduled work — retention sweeps, digests — runs on Brisbane time,
      # which is the day the members are living in. Queensland does not observe
      # daylight saving, so this offset does not move.
      - key: SCHEDULER_TIMEZONE
        value: Australia/Brisbane

      # Off, and not merely "not set up yet": no OpenSearch cluster is part of
      # this deployment, and search on Prisma covers every kind of result.
      #
      # This note used to warn that switching it on would silently drop
      # courses, reels and mentors, whose indexes nothing writes. That is no
      # longer so — search.service.ts sends only members, posts and jobs to the
      # engine and answers the other three from the database. What still makes
      # it worse today is the missing backfill: those three indexes are written
      # only when a row is created or edited, and no script loads the rows that
      # already exist, so every member, post and job from before the switch
      # would drop out of search. Write and run that backfill first.
      #
      # OPENSEARCH_NODE on its own also switches it on (utils/opensearch.ts),
      # so leave that unset too until then.
      - key: OPENSEARCH_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"

      - key: SENTRY_DSN
        sync: false

  # Redis is not optional: the rate limiters, the login lockout counters and
  # every BullMQ queue use it. Render calls this service type "Key Value" in
  # the dashboard; `redis` is the blueprint name for it.
  - type: redis
    name: athena-redis
    region: singapore
    plan: starter
    # No public ingress. Only services in this blueprint reach it, over
    # Render's private network.
    ipAllowList: []
